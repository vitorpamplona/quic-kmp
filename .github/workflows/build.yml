name: Test/Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Linter (gradle)
        run: ./gradlew spotlessCheck

      - name: Check JVM
        run: ./gradlew :quic:jvmTest :quic-interop:test

      - name: Check Android (host)
        run: ./gradlew :quic:testAndroidHostTest

      - name: Build (gradle)
        run: ./gradlew assemble
